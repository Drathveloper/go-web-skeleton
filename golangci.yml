version: "2"
linters:
  settings:
    govet:
      enable-all: true
    tagalign:
      order:
        - json
        - yaml
        - binding
        - validate
        - gorm
  default: all
  disable:
    - depguard
    - wsl
    - wsl_v5
    - noinlineerr
    - tagliatelle
    - nlreturn
    - exhaustruct
  exclusions:
    generated: lax
    rules:
      - path: \.go
        linters:
          - revive
      - path: _test\.go
        linters:
          - gosec
          - varnamelen
          - paralleltest
          - mirror
          - lll
          - funlen
          - forcetypeassert
          - gochecknoglobals
          - err113
          - dupl
          - maintidx
          - cyclop
      # The example module is 12 near-identical CRUDs by design: it is the
      # reference the scaffold generator is validated against, so dupl and
      # duplication-adjacent linters would fire on the pattern itself.
      - path: ^example/
        linters:
          - dupl
      # cmd/scaffold is a code generator CLI, not a service. It prints its
      # progress to stdout, walks and writes files at paths it constructs, and
      # sets octal file modes; the linters below exist to catch exactly those
      # things in request-handling code, where they would be defects.
      - path: ^cmd/scaffold/
        linters:
          - forbidigo
          - mnd
          - gosec
          - cyclop
      - linters:
          - gosec
        text: 'G104:'
      - linters:
          - revive
        text: 'package-comments:'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Drathveloper/go-web-skeleton
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
